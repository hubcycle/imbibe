[package]
name = "imbibe-querier"
version = "0.0.1"
edition.workspace = true
description = "provides Querier to hold a database connection pool, and methods to perform various read operations on the database"
readme = "README.md"
repository.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
graphql = [
  "dep:async-graphql",
  "dep:bytes",
  "dep:chrono",
  "dep:cosmrs",
  "dep:futures",
  "dep:jiff",
  "dep:serde_json",
  "server",
]
server = ["imbibe-persistence/database"]
tarpc = [
  "dep:serde",
  "dep:tarpc",
  "dep:tokio",
  "imbibe-domain/serde",
]

[dependencies]
async-graphql = { workspace = true, optional = true, features = ["chrono"] }
bon = { workspace = true }
bytes = { workspace = true, optional = true }
chrono = { version = "0.4", optional = true }
cosmrs = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
imbibe-domain = { workspace = true }
imbibe-persistence = { workspace = true }
jiff = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
tarpc = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["time"] }
tracing = { workspace = true }

